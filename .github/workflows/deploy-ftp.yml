name: Deploy to FTP on master push

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Debug env
        run: |
          echo "Host: $FTP_HOST"
          echo "User: $FTP_USERNAME"
          # echo "Pass: $FTP_PASSWORD"  # liever niet loggen 😉
          echo "Remote dir: $FTP_REMOTE_DIR"
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}

      # Cache-JSON, locks, sqlite, bijlagen, prefs, avatars en de root-.htaccess
      # blijven op de server. lftp: het laatste passende patroon wint.
      # Includes staan daarom ná de excludes, anders uploadt data/.htaccess niet
      # en wordt bestaande data overschreven of gewist.
      - name: Deploy web/ to FTP (with delete & excludes)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST" << EOF
          set cmd:fail-exit true
          set net:max-retries 1
          set net:timeout 20
          set ftp:ssl-allow false
          set ftp:passive-mode yes

          cd "$FTP_REMOTE_DIR"

          mirror -R --delete \
            --exclude-glob .htaccess \
            --exclude-glob cache/** \
            --exclude-glob cache/odata/** \
            --exclude-glob cache/odata/*/ \
            --exclude-glob data/** \
            --exclude-glob data/ponos/** \
            --exclude-glob data/ponos/attachments/** \
            --exclude-glob data/user_prefs/** \
            --exclude-glob data/user_avatars/** \
            --exclude-glob analytics/*.sqlite \
            --exclude-glob analytics/*.sqlite-* \
            --exclude-glob auth.php \
            --include-glob cache/ \
            --include-glob cache/odata/ \
            --include-glob cache/.htaccess \
            --include-glob cache/index.html \
            --include-glob cache/index.php \
            --include-glob cache/odata/.htaccess \
            --include-glob cache/odata/index.html \
            --include-glob cache/odata/index.php \
            --include-glob data/ \
            --include-glob data/ponos/ \
            --include-glob data/ponos/attachments/ \
            --include-glob data/user_prefs/ \
            --include-glob data/user_avatars/ \
            --include-glob data/.htaccess \
            --include-glob data/index.html \
            --include-glob data/index.php \
            --include-glob data/ponos/.htaccess \
            --include-glob data/ponos/index.html \
            --include-glob data/ponos/index.php \
            --include-glob data/ponos/attachments/.htaccess \
            --include-glob data/ponos/attachments/index.html \
            --include-glob data/ponos/attachments/index.php \
            --include-glob data/user_prefs/.htaccess \
            --include-glob data/user_prefs/index.html \
            --include-glob data/user_prefs/index.php \
            --include-glob data/user_avatars/.htaccess \
            --include-glob data/user_avatars/index.html \
            --include-glob data/user_avatars/index.php \
            ./web .

          set cmd:fail-exit false
          chmod 777 analytics

          bye
          EOF
